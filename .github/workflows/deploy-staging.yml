name: Deploy Staging

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    env:
      DEPLOY_HOST: 168.144.16.172
      DEPLOY_USER: shrenik
      DEPLOY_PATH: /var/www/staging/g2a-activities-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Write .env.staging
        run: |
          cat <<EOF > .env.staging
          VITE_API_BASE_URL=${{ secrets.STAGING_VITE_API_BASE_URL }}
          VITE_BASE_URL=${{ secrets.STAGING_VITE_BASE_URL }}
          VITE_RAZORPAY_KEY_ID=${{ secrets.STAGING_VITE_RAZORPAY_KEY_ID }}
          EOF

      - name: Build (main app + bike-rentals widget)
        run: npm run build:all:staging

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Ensure remote deploy path exists
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"

      - name: Deploy to staging
        run: |
          rsync -avz --delete \
            -e "ssh" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
